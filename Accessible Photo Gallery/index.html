 
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Department of Extremely Cool Trees</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/gallery.js" defer></script>
</head>
<body>

  <h1>The Department of Extremely Cool Trees</h1>

  <div id="image">
    Hover over an image below to display here.
  </div>

  <div class="gallery">
    <figure>
      <img
        class="preview"
        src="images/Beautiful-Tree.jpg"
        alt="A beautiful tree."
        onmouseover="upDate(this)"
        onmouseleave="unDo()"
        onfocus="upDate(this)"
        onblur="unDo()">
      <figcaption>Beautiful-Tree</figcaption>
    </figure>

    <figure>
      <img
        class="preview"
        src="images/Great-Tree.jpg"
        alt="A great tree."
        onmouseover="upDate(this)"
        onmouseleave="unDo()"
        onfocus="upDate(this)"
        onblur="unDo()">
      <figcaption>Great-Tree</figcaption>
    </figure>

    <figure>
      <img
        class="preview"
        src="images/Old-Tree.jpg"
        alt="An old tree."
        onmouseover="upDate(this)"
        onmouseleave="unDo()"
        onfocus="upDate(this)"
        onblur="unDo()">
      <figcaption>Old-Tree</figcaption>
    </figure>

    <figure>
      <img
        class="preview"
        src="images/Tree-and-Human.jpg"
        alt="A tree and a human."
        onmouseover="upDate(this)"
        onmouseleave="unDo()"
        onfocus="upDate(this)"
        onblur="unDo()">
      <figcaption>Tree-and-Human</figcaption>
    </figure>

    <figure>
      <img
        class="preview"
        src="images/Tree-and-the-Sky.jpg"
        alt="A tree reaching toward the sky."
        onmouseover="upDate(this)"
        onmouseleave="unDo()"
        onfocus="upDate(this)"
        onblur="unDo()">
      <figcaption>Tree-and-the-Sky</figcaption>
    </figure>

    <figure>
      <img
        class="preview"
        src="images/Tree-in-City.jpg"
        alt="A tree growing in a city."
        onmouseover="upDate(this)"
        onmouseleave="unDo()"
        onfocus="upDate(this)"
        onblur="unDo()">
      <figcaption>Tree-in-City</figcaption>
    </figure>
  </div>

</body>
</html>
